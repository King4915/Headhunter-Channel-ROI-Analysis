<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猎头渠道效能与风险洞察</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

        :root {
            /* 4A 级高定色彩 */
            --bg-body: #F7F8FA;
            --bg-surface: #FFFFFF;
            --text-primary: #1A1D20;
            --text-secondary: #6B7280;
            --text-tertiary: #9CA3AF;
            
            /* 状态色 - 低饱和莫兰迪 */
            --accent-blue: #3B5BDB;
            --accent-blue-bg: #EDF2FF;
            --accent-green: #0CA678;
            --accent-green-bg: #E6FCF5;
            --accent-red: #E03131;
            --accent-red-bg: #FFF5F5;
            --accent-orange: #F08C00;
            --accent-orange-bg: #FFF9DB;
            
            --border-color: #E5E7EB;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 48px;
        }

        /* 顶部大标题 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .title-group p {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-primary {
            background-color: var(--text-primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background-color: #000; transform: translateY(-1px); box-shadow: var(--shadow-md); }

        /* 顶部异常预警条 */
        .alert-strip {
            display: none;
            background-color: var(--accent-red-bg);
            border-left: 4px solid var(--accent-red);
            padding: 16px 24px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 40px;
            align-items: center;
            justify-content: space-between;
        }
        .alert-strip.show { display: flex; }
        .alert-text { font-size: 14px; font-weight: 500; color: var(--accent-red); display: flex; align-items: center; gap: 8px; }
        .alert-btn { background: var(--accent-red); color: white; border: none; padding: 6px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }

        /* KPI 数据区 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 48px;
        }
        .kpi-card {
            background: var(--bg-surface);
            padding: 32px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }
        .kpi-title {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kpi-value {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .kpi-sub { font-size: 13px; color: var(--text-tertiary); }
        .kpi-sub.danger { color: var(--accent-red); font-weight: 600; }

        /* 主体双栏布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
        }

        /* 左侧表格区 */
        .data-panel {
            background: var(--bg-surface);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .panel-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            font-family: 'Playfair Display', serif;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table th {
            text-align: left; padding: 16px 32px; color: var(--text-tertiary);
            font-weight: 500; font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color);
            background: #FAFAFB;
        }
        .data-table td {
            padding: 20px 32px; border-bottom: 1px solid var(--border-color);
            vertical-align: middle; transition: background 0.2s;
        }
        .data-table tr:hover td { background: #FAFAFB; cursor: pointer; }
        
        /* 异常行左侧红线标记 */
        .row-danger td:first-child { border-left: 4px solid var(--accent-red); padding-left: 28px; }

        /* 标签 */
        .tag-grade {
            display: inline-flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700;
        }
        .grade-a { background: var(--accent-blue-bg); color: var(--accent-blue); }
        .grade-b { background: var(--accent-green-bg); color: var(--accent-green); }
        .grade-c { background: var(--accent-orange-bg); color: var(--accent-orange); }
        .grade-d { background: var(--accent-red-bg); color: var(--accent-red); }

        .alert-pill {
            display: inline-flex; background: var(--accent-red-bg); color: var(--accent-red);
            padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600;
            margin-left: 8px; vertical-align: middle;
        }

        /* 右侧洞察清单 */
        .insight-panel { display: flex; flex-direction: column; gap: 24px; }
        .insight-card {
            background: var(--bg-surface); border-radius: 8px; padding: 24px;
            box-shadow: var(--shadow-sm); border-top: 3px solid var(--text-primary);
        }
        .insight-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .insight-list { display: flex; flex-direction: column; gap: 16px; }
        .insight-item {
            padding: 16px; background: var(--bg-body); border-radius: 6px;
            border-left: 2px solid var(--border-color);
        }
        .insight-item.risk { border-left-color: var(--accent-red); }
        .item-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .item-reason { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .item-action { font-size: 12px; color: var(--accent-blue); font-weight: 600; margin-top: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }

        /* 弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-surface); border-radius: 12px; width: 560px;
            padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }
        .modal-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin-bottom: 32px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; background: var(--bg-body);
            border: 1px solid transparent; border-radius: 4px; color: var(--text-primary);
            font-size: 14px; transition: all 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--text-primary); background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 29, 32, 0.05);
        }
        .form-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }
        .form-hint.danger { color: var(--accent-red); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 32px; }
        .btn-secondary { background: transparent; border: none; color: var(--text-secondary); font-weight: 500; padding: 12px 24px; cursor: pointer; }
        .btn-secondary:hover { color: var(--text-primary); }
        .btn-save { background: var(--text-primary); color: white; border: none; padding: 12px 24px; border-radius: 4px; font-weight: 500; cursor: pointer; }
        .btn-save:hover { background: #000; }

        @media (max-width: 1200px) {
            .main-layout { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="alert-strip" id="alertStrip">
        <div class="alert-text">
            <span>⚠️</span>
            <span id="alertMessage">系统检测到供应商数据异常，请及时处理。</span>
        </div>
        <button class="alert-btn" onclick="document.querySelector('.data-panel').scrollIntoView({behavior: 'smooth'})">查看详情</button>
    </div>

    <div class="page-header">
        <div class="title-group">
            <h1>猎头渠道效能与风险洞察</h1>
            <p>Talent Acquisition ROI & Risk Dashboard</p>
        </div>
        <button class="btn-primary" id="btnAdd">录入最新数据 +</button>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">渠道总投入 (万元)</div>
            <div class="kpi-value" id="kpi-total-cost">--</div>
            <div class="kpi-sub">包含已付与应付尾款</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">实际入职 (人)</div>
            <div class="kpi-value" id="kpi-total-hires">--</div>
            <div class="kpi-sub" id="kpi-high-hires">高职级占比 --%</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">加权分产出</div>
            <div class="kpi-value" id="kpi-total-score">--</div>
            <div class="kpi-sub">基于 P/T/M 职级系数</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">综合保期留存率</div>
            <div class="kpi-value" id="kpi-retention">--</div>
            <div class="kpi-sub" id="kpi-retention-hint">红线健康值 ≥ 60%</div>
        </div>
    </div>

    <div class="main-layout">
        <div class="data-panel">
            <div class="panel-header">供应商明细看板</div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>供应商名称</th><th>评级</th><th>入职数 (高职)</th>
                        <th>加权分</th><th>已付费用</th><th>留存率</th>
                        <th>单入职成本</th><th>过保留存成本</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" style="text-align: center; color: var(--text-tertiary); padding: 40px;">正在获取底层数据...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="insight-panel">
            <div class="insight-card">
                <div class="insight-title"><span>🎯</span> 管理动作建议</div>
                <div class="insight-list" id="riskList">
                    <div style="font-size: 13px; color: var(--text-tertiary); text-align: center; padding: 20px 0;">正在分析数据...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">录入新数据</div>
            <form id="dataForm">
                <input type="hidden" id="supplierId">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>供应商名称 *</label>
                        <input type="text" id="inputName" required placeholder="例如：猎头A">
                    </div>
                    <div class="form-group">
                        <label>评级</label>
                        <select id="inputGrade">
                            <option value="A">A级 (核心)</option>
                            <option value="B">B级 (稳定)</option>
                            <option value="C">C级 (观察)</option>
                            <option value="D">D级 (淘汰)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>已付费用 (万元)</label>
                        <input type="number" step="0.1" id="inputCost" value="0">
                    </div>
                    <div class="form-group">
                        <label>入职总人数</label>
                        <input type="number" id="inputHires" value="0">
                    </div>
                    <div class="form-group">
                        <label>高职级人数 (P5/M4+)</label>
                        <input type="number" id="inputHighHires" value="0">
                    </div>
                    <div class="form-group">
                        <label>加权总分</label>
                        <input type="number" step="0.1" id="inputScore" value="0">
                    </div>
                    <div class="form-group">
                        <label>保期留存率 (%)</label>
                        <input type="number" step="0.1" id="inputRetention" value="0" max="100">
                        <div class="form-hint" id="retentionHint">低于 60% 将触发红线预警</div>
                    </div>
                    <div class="form-group full">
                        <label>备注/状态 (可选)</label>
                        <input type="text" id="inputStatus" placeholder="例如：健康运转">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="btnCancel">取消</button>
                    <button type="submit" class="btn-save" id="btnSave">保存数据</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 填入你的 Supabase 凭证
        // ==========================================
        const SUPABASE_URL = '你的_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = '你的_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tableBody = document.getElementById('tableBody');
        const riskList = document.getElementById('riskList');
        const alertStrip = document.getElementById('alertStrip');
        const alertMessage = document.getElementById('alertMessage');

        // 2. 获取并渲染数据
        async function fetchData() {
            const { data, error } = await supabase.from('hunter_suppliers').select('*').order('weighted_score', { ascending: false });
            if (error) { console.error(error); return; }
            renderUI(data);
        }

        function renderUI(data) {
            let totalCost = 0, totalHires = 0, highHires = 0, totalScore = 0, retentionSum = 0;
            data.forEach(item => {
                totalCost += Number(item.total_cost);
                totalHires += Number(item.total_hires);
                highHires += Number(item.high_level_hires);
                totalScore += Number(item.weighted_score);
                retentionSum += (Number(item.retention_rate) * Number(item.total_hires));
            });

            document.getElementById('kpi-total-cost').innerText = `¥${totalCost.toFixed(1)}`;
            document.getElementById('kpi-total-hires').innerText = `${totalHires}`;
            document.getElementById('kpi-high-hires').innerText = `高职级占比 ${totalHires > 0 ? ((highHires/totalHires)*100).toFixed(1) : 0}%`;
            document.getElementById('kpi-total-score').innerText = `${totalScore.toFixed(1)}`;
            
            const overallRet = totalHires === 0 ? 0 : (retentionSum / totalHires);
            const retEl = document.getElementById('kpi-retention');
            const retHintEl = document.getElementById('kpi-retention-hint');
            retEl.innerText = `${overallRet.toFixed(1)}%`;
            
            if (overallRet < 60) {
                retEl.style.color = 'var(--accent-red)';
                retHintEl.innerText = '已跌破 60% 红线';
                retHintEl.className = 'kpi-sub danger';
            } else {
                retEl.style.color = 'var(--text-primary)';
                retHintEl.innerText = '红线健康值 ≥ 60%';
                retHintEl.className = 'kpi-sub';
            }

            let html = '';
            let riskySuppliers = [];

            data.forEach(item => {
                const perHireCost = item.total_hires > 0 ? (item.total_cost / item.total_hires).toFixed(1) : '0.0';
                const perRetentionCost = (item.total_hires > 0 && item.retention_rate > 0) 
                    ? (item.total_cost / (item.total_hires * (item.retention_rate / 100))).toFixed(1) : '0.0';
                
                const isDanger = item.retention_rate < 60;
                if (isDanger) riskySuppliers.push(item);

                html += `
                    <tr class="${isDanger ? 'row-danger' : ''}" onclick="openEditModal('${item.id}')">
                        <td>
                            <span style="font-weight: 600; font-size: 15px;">${item.name}</span>
                            ${isDanger ? '<span class="alert-pill">需干预</span>' : ''}
                        </td>
                        <td><span class="tag-grade grade-${item.grade.toLowerCase()}">${item.grade}</span></td>
                        <td>${item.total_hires} <span style="color:var(--text-tertiary); font-size:12px;">(${item.high_level_hires})</span></td>
                        <td>${item.weighted_score}</td>
                        <td>¥${item.total_cost}</td>
                        <td><span style="font-weight: 600; color:${isDanger ? 'var(--accent-red)' : 'var(--text-primary)'}">${item.retention_rate}%</span></td>
                        <td>¥${perHireCost}</td>
                        <td>${perRetentionCost > 20 ? `<span style="color:var(--accent-orange)">¥${perRetentionCost}</span>` : `¥${perRetentionCost}`}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;

            if (riskySuppliers.length > 0) {
                alertStrip.classList.add('show');
                alertMessage.innerHTML = `系统监测到 <strong>${riskySuppliers.length}</strong> 家供应商保期留存率低于 60% 红线，建议立即缩减派单或约谈。`;
                
                let riskHtml = '';
                riskySuppliers.forEach(r => {
                    riskHtml += `
                        <div class="insight-item risk">
                            <div class="item-name">
                                <span>${r.name}</span>
                                <span class="tag-grade grade-${r.grade.toLowerCase()}" style="width:20px; height:20px; font-size:10px;">${r.grade}</span>
                            </div>
                            <div class="item-reason">保期留存率仅为 ${r.retention_rate}%，低于公司红线（60%）。可能存在过度包装或岗位匹配度低的问题。</div>
                            <div class="item-action" onclick="openEditModal('${r.id}')">去复核数据 / 发起整改 →</div>
                        </div>
                    `;
                });
                riskList.innerHTML = riskHtml;
            } else {
                alertStrip.classList.remove('show');
                riskList.innerHTML = `<div style="font-size: 13px; color: var(--accent-green); text-align: center; padding: 20px 0;">✨ 所有供应商指标均处于健康区间</div>`;
            }
        }

        // 3. 弹窗与表单逻辑
        let isEditMode = false;
        const modalOverlay = document.getElementById('modalOverlay');
        
        document.getElementById('btnAdd').addEventListener('click', () => {
            isEditMode = false;
            document.getElementById('modalTitle').innerText = '录入新数据';
            document.getElementById('dataForm').reset();
            document.getElementById('supplierId').value = '';
            modalOverlay.classList.add('active');
        });

        window.openEditModal = async (id) => {
            isEditMode = true;
            document.getElementById('modalTitle').innerText = '更新供应商数据';
            const { data, error } = await supabase.from('hunter_suppliers').select('*').eq('id', id).single();
            if (error) return;

            document.getElementById('supplierId').value = data.id;
            document.getElementById('inputName').value = data.name;
            document.getElementById('inputGrade').value = data.grade;
            document.getElementById('inputCost').value = data.total_cost;
            document.getElementById('inputHires').value = data.total_hires;
            document.getElementById('inputHighHires').value = data.high_level_hires;
            document.getElementById('inputScore').value = data.weighted_score;
            document.getElementById('inputRetention').value = data.retention_rate;
            document.getElementById('inputStatus').value = data.status;
            modalOverlay.classList.add('active');
        };

        document.getElementById('btnCancel').addEventListener('click', () => modalOverlay.classList.remove('active'));

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('supplierId').value;
            const payload = {
                name: document.getElementById('inputName').value,
                grade: document.getElementById('inputGrade').value,
                total_cost: parseFloat(document.getElementById('inputCost').value) || 0,
                total_hires: parseInt(document.getElementById('inputHires').value) || 0,
                high_level_hires: parseInt(document.getElementById('inputHighHires').value) || 0,
                weighted_score: parseFloat(document.getElementById('inputScore').value) || 0,
                retention_rate: parseFloat(document.getElementById('inputRetention').value) || 0,
                status: document.getElementById('inputStatus').value
            };

            if (isEditMode) {
                await supabase.from('hunter_suppliers').update(payload).eq('id', id);
            } else {
                await supabase.from('hunter_suppliers').insert([payload]);
            }
            modalOverlay.classList.remove('active');
            fetchData();
        });

        // 4. 实时订阅
        supabase.channel('4a-dashboard')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'hunter_suppliers' }, () => fetchData())
            .subscribe();
            
        // 初始化
        fetchData();
    </script>
</body>
</html>
